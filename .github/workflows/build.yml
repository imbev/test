name: Build

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build image
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v12
    with:
      containerfile: Containerfile
      image-name: ${{ github.event.repository.name }}
      image-description: AlmaLinux Atomic image
      previous-image: ghcr.io/${{ github.repository }}:latest
      # Single platform keeps CI cheap; add arm64 once arm runners are available.
      platforms: amd64
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: read
      packages: write
      id-token: write

  build-iso:
    name: Build ISO
    needs: build-image
    # ISOs are heavy, so only build them on the default branch (via push or dispatch).
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/build-iso.yml@dev/v12
    with:
      image: ${{ needs.build-image.outputs.image-ref }}:${{ github.ref_name }}
      image-name: ${{ github.event.repository.name }}
      # Installed systems track the tag build-image.yml pushes for this branch.
      update-origin-ref: ${{ needs.build-image.outputs.image-ref }}:${{ github.ref_name }}
      # Set to true once a SIGNING_SECRET is configured.
      update-is-signed: false
      config-file: ./iso.toml
      platforms: amd64
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      id-token: write
